[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrv-engine"
version = "0.1.0"
description = "Synthetic satellite-based carbon quantification for the NeelKosh demo"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mrv_engine*"]
